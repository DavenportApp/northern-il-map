services:
  - type: web
    name: crgroupmap
    runtime: python
    buildCommand: echo "No dependencies to install"
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false